steps:
  # 1. Pull the Docker image from Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', '${_DOCKER_IMAGE}']
  
  # 2. Tag the image for Artifact Registry
  # Format: [LOCATION]-docker.pkg.dev/[PROJECT_ID]/[REPO_NAME]/[IMAGE_NAME]:[TAG]
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'tag'
      - '${_DOCKER_IMAGE}'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
  
  # 3. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push' 
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
  
  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '${_PORT}'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DOCKER_IMAGE: 'rajesharigala/placementapp:v1-amd64'
  _SERVICE_NAME: 'placementapp' # Best practice: use lowercase for service names
  _REGION: 'us-central1'
  _PORT: '8080'
  _MEMORY: '512Mi'
  _CPU: '1'

timeout: '1200s'

