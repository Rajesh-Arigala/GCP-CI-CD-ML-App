steps:
  # 1. Pull the Docker image from Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', '${_DOCKER_IMAGE}']
  
  # 2. Tag the image for Artifact Registry
  # Format: [LOCATION]-docker.pkg.dev/[PROJECT_ID]/[REPO_NAME]/[IMAGE_NAME]:[TAG]
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'tag'
      - '${_DOCKER_IMAGE}'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
  
  # 3. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push' 
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
  
  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '${_PORT}'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/placementapp-repo/${_SERVICE_NAME}:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DOCKER_IMAGE: 'rajesharigala/placementapp:v1-amd64'
  _SERVICE_NAME: 'placementapp' # Best practice: use lowercase for service names
  _REGION: 'us-central1'
  _PORT: '8080'
  _MEMORY: '512Mi'
  _CPU: '1'

timeout: '1200s'

# Create the Artifact Registry repository (run this command once before the first build)
# gcloud artifacts repositories create placementapp-repo \
#     --repository-format=docker \
#     --location=us-central1 \
#     --description="Repository for PlacementApp images" \
#     --project=cicd-placementapp-github

# Enable necessary APIs (run this command once before the first build)
# gcloud services enable cloudbuild.googleapis.com \
#     run.googleapis.com \
#     artifactregistry.googleapis.com \
#     --project=cicd-placementapp-github

# Grant Cloud Build permissions to deploy to Cloud Run (run these commands once before the first build)
# # Get your project number
# PROJECT_NUMBER=$(gcloud projects describe cicd-placementapp-github --format='value(projectNumber)')
# echo $PROJECT_NUMBER


# (the gcloud run deploy command) was also likely to fail because the Compute Engine service account doesn't 
# yet have the permissions to manage Cloud Run or act as a service account user.

# # 1. Grant Cloud Run Admin role
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:$PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#     --role="roles/run.admin"

# # 2. Grant IAM Service Account User role (needed to act as the runtime identity)
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:$PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#     --role="roles/iam.serviceAccountUser"

# 3. your Compute Engine Default Service Account (which Cloud Build is using as the execution identity) doesn't 
# have permission to write logs.
#  You can grant it the "Logging Log Writer" role to allow it to write logs to Cloud Logging.
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:829933921570-compute@developer.gserviceaccount.com" \
#     --role="roles/logging.logWriter"


# the service account doesn't have the permission to upload (push) the image to your Artifact Registry repository.
# To fix this once and for all, run these two commands to give both potential service accounts the Artifact Registry 
# Administrator role:
# 1. Grant permission to the Cloud Build service account
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:829933921570@cloudbuild.gserviceaccount.com" \
#     --role="roles/artifactregistry.repoAdmin"

# # 2. Grant permission to the Compute Engine default service account
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:829933921570-compute@developer.gserviceaccount.com" \
#     --role="roles/artifactregistry.repoAdmin"

# build is indeed using the Compute Engine default service account (829933921570-compute@developer.gserviceaccount.com), 
# and it lacks the permissions to create or update the Cloud Run service.
# Please run these two commands in your Cloud Shell to grant the final set of required permissions to that specific account:
# 1. Grant Cloud Run Admin (to create/manage the service)
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:829933921570-compute@developer.gserviceaccount.com" \
#     --role="roles/run.admin"

# 2. Grant Service Account User (to allow it to assign an identity to the Cloud Run service)
# gcloud projects add-iam-policy-binding cicd-placementapp-github \
#     --member="serviceAccount:829933921570-compute@developer.gserviceaccount.com" \
#     --role="roles/iam.serviceAccountUser"

# run.admin: This fixes the PERMISSION_DENIED error. 
# It allows the account to check if the service placementapp exists and to create/update it. 

# iam.serviceAccountUser: This is required for the final deployment, where Cloud Run 
# needs to "act as" a service account to run your container.

